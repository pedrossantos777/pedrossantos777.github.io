<svg width="1000" height="1500" viewBox="0 0 1000 1500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>Fluxograma do workflow — RAIS agregada em H3</title>

  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#555" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ============================================================ -->
  <!-- ETAPA 1 — Fonte de dados -->
  <!-- ============================================================ -->
  <g>
    <rect x="60" y="20" width="880" height="90" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="90" y="52" font-size="16" font-weight="700" fill="#1e3a8a">1. Fonte de dados</text>
    <text x="90" y="76" font-size="13" fill="#1e3a8a">rais_test_20260727.parquet — colunas: h3_address, h3_res, ano, n_firmas, qt_vinc_ativos, uf, code_intermediate, code_muni</text>
    <text x="90" y="96" font-size="12" fill="#3b5bab">(um hexágono H3 por linha, por ano — várias resoluções misturadas)</text>
  </g>

  <line x1="500" y1="110" x2="500" y2="150" stroke="#555" stroke-width="1.6" marker-end="url(#seta)"/>

  <!-- ============================================================ -->
  <!-- ETAPA 2 — Pipeline R (targets + crew) -->
  <!-- ============================================================ -->
  <g>
    <rect x="40" y="150" width="920" height="430" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="70" y="182" font-size="16" font-weight="700" fill="#4c1d95">2. Pipeline R (targets + crew) — _targets.R</text>
    <text x="70" y="202" font-size="12" fill="#5b21b6">targets::tar_make() — branches por resolução/ano rodam em paralelo (crew)</text>

    <!-- sub-caixas -->
    <rect x="70" y="225" width="260" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="200" y="250" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">carregar_rais()</text>
    <text x="200" y="270" font-size="11" fill="#5b21b6" text-anchor="middle">lê o parquet bruto,</text>
    <text x="200" y="286" font-size="11" fill="#5b21b6" text-anchor="middle">detecta anos disponíveis</text>

    <rect x="370" y="225" width="260" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="500" y="250" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">preparar_geometria()</text>
    <text x="500" y="270" font-size="11" fill="#5b21b6" text-anchor="middle">1 linha/hexágono, só h3_address</text>
    <text x="500" y="286" font-size="11" fill="#5b21b6" text-anchor="middle">(sem uf — ramifica por resolução)</text>

    <rect x="670" y="225" width="260" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="800" y="250" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">gerar_pmtiles()</text>
    <text x="800" y="270" font-size="11" fill="#5b21b6" text-anchor="middle">freestile() com as 3</text>
    <text x="800" y="286" font-size="11" fill="#5b21b6" text-anchor="middle">geometrias, coalesce=FALSE</text>

    <line x1="330" y1="265" x2="368" y2="265" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#seta)"/>
    <line x1="630" y1="265" x2="668" y2="265" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#seta)"/>

    <rect x="70" y="335" width="260" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="200" y="360" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">preparar_atributos()</text>
    <text x="200" y="380" font-size="11" fill="#5b21b6" text-anchor="middle">agrega n_firmas/qt_vinc_ativos</text>
    <text x="200" y="396" font-size="11" fill="#5b21b6" text-anchor="middle">por resolução × ano</text>

    <rect x="370" y="335" width="260" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="500" y="360" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">exportar_atributos_parquet()</text>
    <text x="500" y="380" font-size="11" fill="#5b21b6" text-anchor="middle">um .parquet por combinação</text>
    <text x="500" y="396" font-size="11" fill="#5b21b6" text-anchor="middle">resolução × ano</text>

    <rect x="670" y="335" width="260" height="80" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
    <text x="800" y="360" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">gerar_uf_lookup()</text>
    <text x="800" y="380" font-size="11" fill="#5b21b6" text-anchor="middle">vem direto do df bruto —</text>
    <text x="800" y="396" font-size="11" fill="#5b21b6" text-anchor="middle">pipeline paralelo, não da geometria</text>

    <line x1="330" y1="375" x2="368" y2="375" stroke="#7c3aed" stroke-width="1.4" marker-end="url(#seta)"/>

    <text x="70" y="450" font-size="13" font-weight="700" fill="#4c1d95">Saídas geradas:</text>
    <rect x="70" y="462" width="270" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/>
    <text x="205" y="488" font-size="12" fill="#4c1d95" text-anchor="middle">geometria.pmtiles (1 arquivo)</text>

    <rect x="360" y="462" width="270" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/>
    <text x="495" y="488" font-size="12" fill="#4c1d95" text-anchor="middle">dados/hex_rXX_ANO.parquet (N arquivos)</text>

    <rect x="650" y="462" width="270" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1"/>
    <text x="785" y="488" font-size="12" fill="#4c1d95" text-anchor="middle">uf_lookup.parquet (1 arquivo)</text>

    <text x="70" y="545" font-size="12" fill="#5b21b6">checar_hexagonos_multi_uf() é informativa — conta hexágonos de fronteira</text>
    <text x="70" y="563" font-size="12" fill="#5b21b6">entre UFs, mas nunca altera a geometria (que só usa h3_address).</text>
  </g>

  <line x1="500" y1="580" x2="500" y2="620" stroke="#555" stroke-width="1.6" marker-end="url(#seta)"/>

  <!-- ============================================================ -->
  <!-- ETAPA 3 — Armazenamento -->
  <!-- ============================================================ -->
  <g>
    <rect x="60" y="620" width="880" height="120" rx="16" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="90" y="652" font-size="16" font-weight="700" fill="#064e3b">3. Armazenamento — Cloudflare R2</text>
    <text x="90" y="674" font-size="12" fill="#065f46">Bucket público, CORS habilitado (GET/HEAD, header Range exposto) — necessário para o navegador</text>
    <text x="90" y="692" font-size="12" fill="#065f46">ler os arquivos parcialmente (byte-range) e via JavaScript sem bloqueio de CORS.</text>
    <text x="90" y="716" font-size="12" fill="#047857" font-style="italic">Arquivos na raiz do bucket: geometria.pmtiles · dados/*.parquet · uf_lookup.parquet</text>
  </g>

  <line x1="500" y1="740" x2="500" y2="780" stroke="#555" stroke-width="1.6" marker-end="url(#seta)"/>

  <!-- ============================================================ -->
  <!-- ETAPA 4 — Frontend estático -->
  <!-- ============================================================ -->
  <g>
    <rect x="60" y="780" width="880" height="120" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="90" y="812" font-size="16" font-weight="700" fill="#7c2d12">4. Frontend estático — map_br.html (GitHub Pages)</text>
    <text x="90" y="834" font-size="12" fill="#9a3412">Um único arquivo HTML/JS. Sem servidor, sem backend, sem build step. Bibliotecas via CDN:</text>
    <text x="90" y="854" font-size="12" fill="#9a3412">MapLibre GL JS (renderização) · pmtiles.js (protocolo de leitura) · DuckDB-WASM (motor SQL no navegador)</text>
    <text x="90" y="876" font-size="12" fill="#c2410c" font-style="italic">Publicado como arquivo estático — qualquer pessoa acessa só com um navegador, sem instalar nada.</text>
  </g>

  <line x1="500" y1="900" x2="500" y2="940" stroke="#555" stroke-width="1.6" marker-end="url(#seta)"/>

  <!-- ============================================================ -->
  <!-- ETAPA 5 — Navegador do usuário -->
  <!-- ============================================================ -->
  <g>
    <rect x="40" y="940" width="920" height="540" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="70" y="972" font-size="16" font-weight="700" fill="#831843">5. Navegador do usuário — o que acontece ao abrir o mapa</text>

    <rect x="70" y="995" width="400" height="70" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.2"/>
    <text x="270" y="1020" font-size="13" font-weight="700" fill="#831843" text-anchor="middle">MapLibre GL JS lê geometria.pmtiles</text>
    <text x="270" y="1040" font-size="11" fill="#9d174d" text-anchor="middle">desenha os hexágonos (3 camadas por resolução, promoteId = h3_address)</text>

    <rect x="530" y="995" width="400" height="70" rx="10" fill="#ffffff" stroke="#db2777" stroke-width="1.2"/>
    <text x="730" y="1020" font-size="13" font-weight="700" fill="#831843" text-anchor="middle">DuckDB-WASM consulta os .parquet</text>
    <text x="730" y="1040" font-size="11" fill="#9d174d" text-anchor="middle">baixa o arquivo do ano ativo, roda SQL (SELECT/JOIN/quantile_cont)</text>

    <line x1="270" y1="1065" x2="270" y2="1090" stroke="#db2777" stroke-width="1.4"/>
    <line x1="730" y1="1065" x2="730" y2="1090" stroke="#db2777" stroke-width="1.4"/>
    <line x1="270" y1="1090" x2="500" y2="1090" stroke="#db2777" stroke-width="1.4"/>
    <line x1="730" y1="1090" x2="500" y2="1090" stroke="#db2777" stroke-width="1.4"/>
    <line x1="500" y1="1090" x2="500" y2="1108" stroke="#db2777" stroke-width="1.4" marker-end="url(#seta)"/>

    <rect x="340" y="1110" width="320" height="60" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.4"/>
    <text x="500" y="1134" font-size="13" font-weight="700" fill="#831843" text-anchor="middle">feature-state</text>
    <text x="500" y="1154" font-size="11" fill="#9d174d" text-anchor="middle">"cola" o valor certo no hexágono certo, via h3_address</text>

    <line x1="500" y1="1170" x2="500" y2="1200" stroke="#555" stroke-width="1.6" marker-end="url(#seta)"/>

    <text x="70" y="1225" font-size="13" font-weight="700" fill="#831843">Interações disponíveis (recalculam via SQL, sem novo deploy):</text>

    <rect x="70" y="1240" width="205" height="56" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1"/>
    <text x="172" y="1263" font-size="11.5" font-weight="600" fill="#831843" text-anchor="middle">Ano / Variável /</text>
    <text x="172" y="1280" font-size="11.5" font-weight="600" fill="#831843" text-anchor="middle">Fórmula SQL customizada</text>

    <rect x="290" y="1240" width="205" height="56" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1"/>
    <text x="392" y="1263" font-size="11.5" font-weight="600" fill="#831843" text-anchor="middle">Classificação</text>
    <text x="392" y="1280" font-size="11.5" font-weight="600" fill="#831843" text-anchor="middle">(quantis / igual / Jenks)</text>

    <rect x="510" y="1240" width="205" height="56" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1"/>
    <text x="612" y="1263" font-size="11.5" font-weight="600" fill="#831843" text-anchor="middle">Filtro de área</text>
    <text x="612" y="1280" font-size="11.5" font-weight="600" fill="#831843" text-anchor="middle">(Região / UF, via SQL)</text>

    <rect x="730" y="1240" width="205" height="56" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1"/>
    <text x="832" y="1263" font-size="11.5" font-weight="600" fill="#831843" text-anchor="middle">Paleta / Opacidade /</text>
    <text x="832" y="1280" font-size="11.5" font-weight="600" fill="#831843" text-anchor="middle">Fundo do mapa</text>

    <rect x="290" y="1316" width="420" height="56" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="1"/>
    <text x="500" y="1339" font-size="11.5" font-weight="600" fill="#831843" text-anchor="middle">Exportar CSV</text>
    <text x="500" y="1356" font-size="11.5" font-weight="600" fill="#831843" text-anchor="middle">(resolução escolhida, respeitando os filtros ativos)</text>

    <text x="70" y="1420" font-size="12" fill="#9d174d" font-style="italic">Nada disso passa por um servidor de aplicação — todo o processamento roda</text>
    <text x="70" y="1440" font-size="12" fill="#9d174d" font-style="italic">dentro do próprio navegador de quem está usando o mapa.</text>
  </g>
</svg>
